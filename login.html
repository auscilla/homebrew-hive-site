<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Homebrew Hive</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f7;
      color: #111;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Left Menu Trigger */
    .menu-btn {
      position: absolute;
      top: 24px;
      left: 32px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #333;
      cursor: pointer;
      z-index: 10;
      padding: 8px 0;
    }

    /* Slide-out Overlay Drawer */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background-color: #111111;
      color: #ffffff;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.2);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Auth Container Box */
    .auth-container {
      max-width: 420px;
      width: 90%;
      margin: 100px auto 40px;
      background: #ffffff;
      padding: 32px;
      border: 2px solid #111;
      border-radius: 8px;
      text-align: center;
    }

    .role-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #111;
      background: #f0f0f0;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
    }

    .role-btn.active {
      background: #111;
      color: #fff;
    }

    .auth-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #111;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .submit-btn:hover {
      background: #333;
    }

    .switch-mode {
      margin-top: 20px;
      font-size: 13px;
    }

    .switch-mode a {
      color: #111;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .error-msg {
      color: #d9534f;
      font-size: 13px;
      margin-top: 10px;
    }

    /* Dashboard View */
    .dashboard {
      display: none;
      text-align: left;
    }

    .dashboard h2 {
      margin-bottom: 8px;
    }

    .dashboard p {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .info-card {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .info-card h3 {
      font-size: 14px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .logout-btn {
      padding: 8px 16px;
      background: #d9534f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Menu Trigger Button -->
  <button class="menu-btn" id="openMenu">MENU</button>

  <!-- Navigation Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span>MENU</span>
      <button class="close-btn" id="closeMenu">&times;</button>
    </div>
    <nav class="nav-links">
      <a href="index.html">HOME</a>
      <a href="how-it-works.html">HOW IT WORKS</a>
      <a href="games.html">GAMES</a>
      <a href="login.html">LOGIN</a>
      <a href="find-us.html">FIND US</a>
      <a href="request-us.html">REQUEST US</a>
      <a href="contact-us.html">CONTACT US</a>
    </nav>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <!-- Login / Register Card -->
  <div class="auth-container" id="authBox">
    
    <!-- Role Selector -->
    <div class="role-toggle">
      <button class="role-btn active" id="gamerRoleBtn" onclick="setRole('gamer')">GAMER</button>
      <button class="role-btn" id="devRoleBtn" onclick="setRole('dev')">GAME DEV</button>
    </div>

    <h2 class="auth-title" id="formTitle">Gamer Login</h2>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="gamer@example.com" />
      </div>

      <div class="form-group">
        <label for="pin">4-Digit PIN</label>
        <input type="password" id="pin" maxlength="4" pattern="\d{4}" inputmode="numeric" required placeholder="1234" />
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Log In</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="switch-mode" id="switchMode">
      Don't have an account? <a onclick="toggleMode()">Create Account</a>
    </div>
  </div>

  <!-- Account Dashboard (Hidden by default) -->
  <div class="auth-container dashboard" id="dashboardBox">
    <h2 id="dashEmail">Welcome!</h2>
    <p id="dashRole">Account Type: Gamer</p>

    <div class="info-card">
      <h3>Wishlist</h3>
      <p id="dashWishlist">No items in wishlist yet.</p>
    </div>

    <div class="info-card">
      <h3>Past Purchases</h3>
      <p id="dashPurchases">No past transactions found.</p>
    </div>

    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>

  <script>
    // 1. Menu Interactions
    const openMenuBtn = document.getElementById('openMenu');
    const closeMenuBtn = document.getElementById('closeMenu');
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');

    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    openMenuBtn.addEventListener('click', openDrawer);
    closeMenuBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);

    // 2. Supabase Initialization
    const SUPABASE_URL = 'https://tskbfytfjsiavwysecuk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_I27CpcilWluOjUSSb6y_pQ_t9ylEjmB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 3. State Management
    let selectedRole = 'gamer'; 
    let isSignUp = false;

    function setRole(role) {
      selectedRole = role;
      document.getElementById('gamerRoleBtn').classList.toggle('active', role === 'gamer');
      document.getElementById('devRoleBtn').classList.toggle('active', role === 'dev');
      updateFormUI();
    }

    function toggleMode() {
      isSignUp = !isSignUp;
      updateFormUI();
    }

    function updateFormUI() {
      const roleText = selectedRole === 'gamer' ? 'Gamer' : 'Game Dev';
      document.getElementById('formTitle').textContent = isSignUp ? `Create ${roleText} Account` : `${roleText} Login`;
      document.getElementById('submitBtn').textContent = isSignUp ? 'Create Account' : 'Log In';
      document.getElementById('switchMode').innerHTML = isSignUp 
        ? `Already have an account? <a onclick="toggleMode()">Log In</a>` 
        : `Don't have an account? <a onclick="toggleMode()">Create Account</a>`;
      document.getElementById('errorMsg').textContent = '';
    }

    // 4. Submit Handler
    async function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pin = document.getElementById('pin').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.textContent = '';

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        errorMsg.textContent = 'PIN must be exactly 4 digits.';
        return;
      }

      if (isSignUp) {
        // Create Account
        const { data, error } = await supabaseClient
          .from('users')
          .insert([
            { 
              email: email, 
              pin: pin, 
              account_type: selectedRole,
              wishlist: '',
              purchases: ''
            }
          ])
          .select();

        if (error) {
          errorMsg.textContent = 'Error creating account. Email may already be registered.';
          return;
        }

        showDashboard(data[0]);

      } else {
        // Login Check
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('email', email)
          .eq('pin', pin)
          .eq('account_type', selectedRole)
          .single();

        if (error || !data) {
          errorMsg.textContent = 'Invalid email or 4-digit PIN.';
          return;
        }

        showDashboard(data);
      }
    }

    function showDashboard(user) {
      document.getElementById('authBox').style.display = 'none';
      document.getElementById('dashboardBox').style.display = 'block';

      document.getElementById('dashEmail').textContent = `Welcome, ${user.email}!`;
      document.getElementById('dashRole').textContent = `Account Type: ${user.account_type === 'gamer' ? 'Gamer' : 'Game Developer'}`;
      document.getElementById('dashWishlist').textContent = user.wishlist || 'No items in wishlist yet.';
      document.getElementById('dashPurchases').textContent = user.purchases || 'No past transactions found.';
    }

    function logout() {
      document.getElementById('authBox').style.display = 'block';
      document.getElementById('dashboardBox').style.display = 'none';
      document.getElementById('authForm').reset();
    }
  </script>
</body>
</html>

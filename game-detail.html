<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Detail - Homebrew Hive</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f7;
      color: #111;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Left Menu Trigger */
    .menu-btn {
      position: absolute;
      top: 24px;
      left: 32px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #333;
      cursor: pointer;
      z-index: 10;
      padding: 8px 0;
    }

    /* Slide-out Overlay Drawer */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background-color: #111111;
      color: #ffffff;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.2);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Main Container */
    .container {
      max-width: 1000px;
      margin: 80px auto 40px;
      padding: 0 20px;
      width: 100%;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 50px;
      align-items: start;
    }

    .main-media-box {
      text-align: center;
    }

    .main-cartridge-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      object-fit: contain;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.2s ease;
    }

    .main-cartridge-img:hover {
      transform: scale(1.02);
    }

    .info-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-title {
      font-size: 2.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .price-tag {
      font-size: 1.1rem;
      font-weight: 700;
      color: #222;
      text-transform: uppercase;
    }

    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: #444;
    }

    .action-btn {
      display: inline-block;
      align-self: flex-start;
      padding: 12px 24px;
      background-color: #111;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .action-btn:hover {
      background-color: #333;
    }

    .action-btn.added {
      background-color: #2e7d32;
    }

    /* Screenshots Grid (4 on Desktop, 2x2 on Mobile) */
    .screenshots-grid {
      display: grid;
      grid-template-columns: repeat(4, 140px);
      gap: 12px;
      margin-top: 10px;
    }

    .screenshot-thumb {
      width: 100%;
      height: 105px;
      object-fit: cover;
      border: 2px solid #111;
      border-radius: 4px;
      cursor: pointer !important;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .screenshot-thumb:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .return-link {
      display: block;
      text-align: center;
      margin-top: 60px;
      color: #555;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .return-link:hover {
      color: #111;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 85vw;
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img {
      max-width: 80vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    /* Lightbox Controls */
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      background: none;
      border: none;
      color: #fff;
      font-size: 36px;
      font-weight: 300;
      cursor: pointer;
      z-index: 210;
      line-height: 1;
    }

    .lightbox-close:hover {
      color: #ffcc00;
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(17, 17, 17, 0.8);
      color: #fff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      z-index: 210;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .lightbox-arrow:hover {
      background: #ffcc00;
      color: #111;
      border-color: #111;
    }

    .lightbox-arrow.left {
      left: 30px;
    }

    .lightbox-arrow.right {
      right: 30px;
    }

    @media (max-width: 768px) {
      .detail-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }
      .screenshots-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .screenshot-thumb {
        height: 110px;
      }
      .lightbox-arrow {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      .lightbox-arrow.left { left: 10px; }
      .lightbox-arrow.right { right: 10px; }
    }
  </style>
</head>
<body>

  <!-- Menu Trigger Button -->
  <button class="menu-btn" id="openMenu">MENU</button>

  <!-- Navigation Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span>MENU</span>
      <button class="close-btn" id="closeMenu">&times;</button>
    </div>
    <nav class="nav-links">
      <a href="index.html">HOME</a>
      <a href="how-it-works.html">HOW IT WORKS</a>
      <a href="games.html">GAMES</a>
      <a href="login.html">LOGIN</a>
      <a href="find-us.html">FIND US</a>
      <a href="request-us.html">REQUEST US</a>
      <a href="contact-us.html">CONTACT US</a>
    </nav>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <main class="container">
    <div class="detail-grid">
      
      <!-- Main Image Box -->
      <div class="main-media-box">
        <img id="cartridgeImg" src="" alt="Game Cartridge" class="main-cartridge-img" onclick="openLightbox(0)" />
      </div>

      <!-- Info Details -->
      <div class="info-box">
        <h1 id="gameTitle" class="game-title">Loading...</h1>
        <div id="gamePrice" class="price-tag">PRINT PRICE: $10.99</div>
        <p id="gameDesc" class="description"></p>

        <button id="wishlistBtn" class="action-btn" onclick="toggleWishlist()">+ Add to Wishlist</button>

        <!-- Screenshots Grid -->
        <div id="screenshotsGrid" class="screenshots-grid"></div>
      </div>

    </div>

    <a href="games.html" class="return-link">Return to Selection</a>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-arrow left" onclick="navigateLightbox(-1, event)">&#8249;</button>
    
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Enlarged View" />
    </div>

    <button class="lightbox-arrow right" onclick="navigateLightbox(1, event)">&#8250;</button>
  </div>

  <script>
    // 1. Menu Interactions
    const openMenuBtn = document.getElementById('openMenu');
    const closeMenuBtn = document.getElementById('closeMenu');
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');

    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    openMenuBtn.addEventListener('click', openDrawer);
    closeMenuBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);

    // 2. Supabase Initialization
    const SUPABASE_URL = 'https://tskbfytfjsiavwysecuk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_I27CpcilWluOjUSSb6y_pQ_t9ylEjmB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let galleryImages = [];
    let currentImageIndex = 0;

    // 3. Load Game Data & Lightbox Grid
    async function loadGameDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get('id');

      if (!gameId) {
        window.location.href = 'games.html';
        return;
      }

      const { data, error } = await supabaseClient
        .from('games')
        .select('*')
        .eq('id', gameId)
        .single();

      if (error || !data) {
        console.error('Error fetching game details:', error);
        document.getElementById('gameTitle').textContent = 'Game Not Found';
        return;
      }

      // Populate Text & Price
      document.getElementById('gameTitle').textContent = data.title;
      
      let priceVal = "10.99";
      if (data.price !== undefined && data.price !== null && !isNaN(parseFloat(data.price))) {
        priceVal = parseFloat(data.price).toFixed(2);
      }
      document.getElementById('gamePrice').textContent = `PRINT PRICE: $${priceVal}`;
      document.getElementById('gameDesc').textContent = data.description || 'No description available.';

      const mainImgSrc = data.cartridge_image_url || data.image_url;
      document.getElementById('cartridgeImg').src = mainImgSrc;

      // Reset gallery
      galleryImages = [mainImgSrc];

      const shotsGrid = document.getElementById('screenshotsGrid');
      shotsGrid.innerHTML = '';

      // Check for screenshots in data or build defaults
      let shotsList = [];

      if (Array.isArray(data.screenshots)) {
        shotsList = data.screenshots;
      } else if (typeof data.screenshots === 'string' && data.screenshots.trim().length > 0) {
        try {
          shotsList = JSON.parse(data.screenshots);
        } catch (e) {
          shotsList = data.screenshots.split(',').map(s => s.trim()).filter(Boolean);
        }
      }

      // Default fallback screenshots if none stored in DB
      if (shotsList.length === 0) {
        shotsList = ['shot1.png', 'shot2.png', 'shot3.png', 'shot4.png'];
      }

      // Render thumbnails and add to gallery
      shotsList.forEach((shotUrl) => {
        galleryImages.push(shotUrl);
        const imgIndex = galleryImages.length - 1;

        const img = document.createElement('img');
        img.src = shotUrl;
        img.className = 'screenshot-thumb';
        img.alt = 'Screenshot';
        img.onclick = () => openLightbox(imgIndex);
        shotsGrid.appendChild(img);
      });
    }

    // 4. Lightbox Controls
    function openLightbox(index) {
      if (galleryImages.length === 0) return;
      currentImageIndex = index;
      document.getElementById('lightboxImg').src = galleryImages[currentImageIndex];
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function navigateLightbox(direction, event) {
      if (event) event.stopPropagation();
      currentImageIndex += direction;
      if (currentImageIndex < 0) {
        currentImageIndex = galleryImages.length - 1;
      } else if (currentImageIndex >= galleryImages.length) {
        currentImageIndex = 0;
      }
      document.getElementById('lightboxImg').src = galleryImages[currentImageIndex];
    }

    document.getElementById('lightbox').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => {
      const lightbox = document.getElementById('lightbox');
      if (!lightbox.classList.contains('active')) return;

      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
    });

    // 5. Wishlist Placeholder
    async function toggleWishlist() {
      const btn = document.getElementById('wishlistBtn');
      btn.textContent = 'Added to Wishlist ✓';
      btn.classList.add('added');
    }

    loadGameDetail();
  </script>
</body>
</html>

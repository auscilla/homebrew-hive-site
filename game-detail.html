<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Detail - Homebrew Hive</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f7;
      color: #111;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Left Menu Trigger */
    .menu-btn {
      position: absolute;
      top: 24px;
      left: 32px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #333;
      cursor: pointer;
      z-index: 10;
      padding: 8px 0;
    }

    /* Slide-out Overlay Drawer */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background-color: #111111;
      color: #ffffff;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.2);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Main Detail Layout Container */
    .detail-container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 90px 24px 40px;
      display: flex;
      gap: 50px;
      align-items: flex-start;
      flex: 1;
      width: 100%;
    }

    /* Left Column: Cartridge View */
    .cartridge-col {
      flex: 0 0 320px;
      display: flex;
      justify-content: center;
    }

    .hero-cartridge {
      width: 100%;
      max-width: 320px;
      height: auto;
      object-fit: contain;
    }

    /* Right Column: Game Info & Media */
    .info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .game-header-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #111;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .print-price {
      font-size: 1.35rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 20px;
    }

    .game-description {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #333;
      margin-bottom: 30px;
      max-width: 600px;
    }

    /* Wishlist Button */
    .wishlist-btn {
      align-self: flex-start;
      padding: 12px 24px;
      background-color: #111;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 24px;
      transition: background-color 0.2s ease;
    }

    .wishlist-btn:hover {
      background-color: #333;
    }

    /* Screenshot Gallery Row */
    .screenshots-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .screenshot-img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid #ddd;
      object-fit: cover;
    }

    /* Status Messages */
    .status-msg {
      width: 100%;
      text-align: center;
      padding: 100px 20px;
      font-size: 1.2rem;
      color: #555;
    }

    /* Wishlist Modal Window */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      padding: 32px;
      border-radius: 8px;
      border: 2px solid #111;
      width: 90%;
      max-width: 380px;
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .modal-subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .modal-form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .modal-form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .modal-form-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #111;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .modal-submit-btn {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-error {
      color: #d9534f;
      font-size: 13px;
      margin-top: 10px;
    }

    .modal-success {
      color: #2e7d32;
      font-size: 13px;
      margin-top: 10px;
    }

    /* Footer Back Link */
    .footer-nav {
      text-align: center;
      padding: 30px 20px 50px;
    }

    .back-link {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #333;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 850px) {
      .detail-container {
        flex-direction: column;
        align-items: center;
        padding-top: 70px;
        gap: 30px;
      }

      .cartridge-col {
        flex: initial;
        width: 100%;
        max-width: 260px;
      }

      .info-col {
        width: 100%;
        text-align: center;
      }

      .game-description {
        margin-left: auto;
        margin-right: auto;
      }

      .wishlist-btn {
        align-self: center;
      }

      .screenshots-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Menu Button -->
  <button class="menu-btn" id="openMenu">MENU</button>

  <!-- Navigation Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span>MENU</span>
      <button class="close-btn" id="closeMenu">&times;</button>
    </div>
    <nav class="nav-links">
      <a href="index.html">HOME</a>
      <a href="how-it-works.html">HOW IT WORKS</a>
      <a href="games.html">GAMES</a>
      <a href="login.html">LOGIN</a>
      <a href="find-us.html">FIND US</a>
      <a href="request-us.html">REQUEST US</a>
      <a href="#contact-us">CONTACT US</a>
    </nav>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <!-- Loading View -->
  <div id="loadingMsg" class="status-msg">Loading game details...</div>

  <!-- Detail Content Layout -->
  <div class="detail-container" id="gameDetail" style="display: none;">
    
    <!-- Left Column: Hero Cartridge -->
    <div class="cartridge-col">
      <img id="cartImg" src="" alt="Game Cartridge" class="hero-cartridge" />
    </div>

    <!-- Right Column: Details & Screenshots -->
    <div class="info-col">
      <h1 class="game-header-title" id="gameTitle"></h1>
      <p class="print-price" id="gamePrice"></p>
      
      <p class="game-description" id="gameDesc"></p>

      <button class="wishlist-btn" id="openWishlistModal">+ Add to Wishlist</button>

      <div class="screenshots-row">
        <img src="shot1.png" alt="Screenshot 1" class="screenshot-img" />
        <img src="shot2.png" alt="Screenshot 2" class="screenshot-img" />
        <img src="shot3.png" alt="Screenshot 3" class="screenshot-img" />
        <img src="shot4.png" alt="Screenshot 4" class="screenshot-img" />
      </div>
    </div>

  </div>

  <!-- Wishlist Modal -->
  <div class="modal-overlay" id="wishlistModal">
    <div class="modal-box">
      <button class="modal-close" id="closeWishlistModal">&times;</button>
      <h3 class="modal-title">Save to Wishlist</h3>
      <p class="modal-subtitle">Enter your email and 4-digit PIN to save this game to your profile.</p>

      <form id="wishlistForm">
        <div class="modal-form-group">
          <label for="modalEmail">Email Address</label>
          <input type="email" id="modalEmail" required placeholder="gamer@example.com" />
        </div>

        <div class="modal-form-group">
          <label for="modalPin">4-Digit PIN</label>
          <input type="password" id="modalPin" maxlength="4" pattern="\d{4}" inputmode="numeric" required placeholder="1234" />
        </div>

        <button type="submit" class="modal-submit-btn">Confirm & Save</button>
        <div id="modalMsg"></div>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <footer class="footer-nav">
    <a href="games.html" class="back-link">RETURN TO SELECTION</a>
  </footer>

  <script>
    // 1. Menu Interactions
    const openMenuBtn = document.getElementById('openMenu');
    const closeMenuBtn = document.getElementById('closeMenu');
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');

    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    openMenuBtn.addEventListener('click', openDrawer);
    closeMenuBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);

    // 2. Supabase Initialization
    const SUPABASE_URL = 'https://tskbfytfjsiavwysecuk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_I27CpcilWluOjUSSb6y_pQ_t9ylEjmB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentGameTitle = '';

    // 3. Fetch Game Detail based on URL parameter (?id=X)
    async function fetchGameDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get('id');

      const loadingMsg = document.getElementById('loadingMsg');
      const gameDetail = document.getElementById('gameDetail');

      if (!gameId) {
        loadingMsg.textContent = 'No game selected.';
        return;
      }

      const { data: game, error } = await supabaseClient
        .from('games')
        .select('*')
        .eq('id', gameId)
        .single();

      if (error || !game) {
        console.error('Error fetching game details:', error);
        loadingMsg.textContent = 'Game not found.';
        return;
      }

      // Store Title for Wishlist
      currentGameTitle = game.title;

      // Populate UI
      document.title = `${game.title} - Homebrew Hive`;
      document.getElementById('gameTitle').textContent = game.title;
      document.getElementById('gamePrice').textContent = `PRINT PRICE: ${game.price || '$19.99'}`;
      document.getElementById('gameDesc').textContent = game.description || '';
      document.getElementById('cartImg').src = game.cartridge_image_url || game.image_url;
      document.getElementById('cartImg').alt = game.title;

      // Show container
      loadingMsg.style.display = 'none';
      gameDetail.style.display = 'flex';
    }

    fetchGameDetail();

    // 4. Modal Handling & Wishlist Submission
    const modal = document.getElementById('wishlistModal');
    const openModalBtn = document.getElementById('openWishlistModal');
    const closeModalBtn = document.getElementById('closeWishlistModal');
    const wishlistForm = document.getElementById('wishlistForm');
    const modalMsg = document.getElementById('modalMsg');

    openModalBtn.addEventListener('click', () => {
      modal.classList.add('active');
      modalMsg.textContent = '';
      modalMsg.className = '';
    });

    closeModalBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    wishlistForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('modalEmail').value.trim().toLowerCase();
      const pin = document.getElementById('modalPin').value.trim();

      modalMsg.textContent = 'Verifying...';
      modalMsg.className = '';

      // Verify account credentials
      const { data: user, error: fetchErr } = await supabaseClient
        .from('users')
        .select('*')
        .eq('email', email)
        .eq('pin', pin)
        .single();

      if (fetchErr || !user) {
        modalMsg.textContent = 'Account not found or incorrect PIN.';
        modalMsg.className = 'modal-error';
        return;
      }

      // Calculate new wishlist value
      let currentWishlist = user.wishlist ? user.wishlist.split(', ').filter(Boolean) : [];
      if (!currentWishlist.includes(currentGameTitle)) {
        currentWishlist.push(currentGameTitle);
      }
      const updatedWishlistStr = currentWishlist.join(', ');

      // Update Supabase user record
      const { error: updateErr } = await supabaseClient
        .from('users')
        .update({ wishlist: updatedWishlistStr })
        .eq('id', user.id);

      if (updateErr) {
        modalMsg.textContent = 'Failed to update wishlist.';
        modalMsg.className = 'modal-error';
      } else {
        modalMsg.textContent = `"${currentGameTitle}" added to your wishlist!`;
        modalMsg.className = 'modal-success';
        setTimeout(() => {
          modal.classList.remove('active');
          wishlistForm.reset();
        }, 1800);
      }
    });
  </script>
</body>
</html>

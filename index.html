<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homebrew Hive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f7;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Top Left Menu Trigger */
    .menu-btn {
      position: absolute;
      top: 24px;
      left: 32px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #333;
      cursor: pointer;
      z-index: 10;
      padding: 8px 0;
    }

    /* Slide-out Overlay Drawer */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background-color: #111111;
      color: #ffffff;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .drawer-header span {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    .nav-links a:hover {
      opacity: 0.7;
    }

    /* Main Hero Area */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      text-align: center;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 400;
      max-width: 500px;
      line-height: 1.25;
      margin-bottom: 40px;
      color: #111;
    }

    .kiosk-container {
      position: relative;
      max-width: 420px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .kiosk-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Backdrop dimming overlay */
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.2);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 600px) {
      .menu-btn {
        top: 16px;
        left: 20px;
      }

      .drawer {
        width: 85vw; /* Fills most of small mobile screens */
        padding: 20px 24px;
      }

      .nav-links a {
        font-size: 24px;
      }

      .hero-title {
        font-size: 1.6rem;
        margin-bottom: 24px;
      }

      .kiosk-container {
        max-width: 300px;
      }
    }
  </style>
</head>
<body>

  <!-- Menu Trigger Button -->
  <button class="menu-btn" id="openMenu">MENU</button>

  <!-- Slide-out Navigation Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span>MENU</span>
      <button class="close-btn" id="closeMenu">&times;</button>
    </div>
    <nav class="nav-links">
      <a href="#home">HOME</a>
      <a href="#how-it-works">HOW IT WORKS</a>
      <a href="#games">GAMES</a>
      <a href="#login">LOGIN</a>
      <a href="#find-us">FIND US</a>
      <a href="#request-us">REQUEST US</a>
      <a href="#contact-us">CONTACT US</a>
    </nav>
  </div>

  <!-- Background Dimming Layer -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Main Home Page Content -->
  <main class="hero">
    <h1 class="hero-title">A Game Boy Printing Kiosk for Retro Game Shops</h1>
    <div class="kiosk-container">
      <!-- Replace kiosk-render.png with your hosted image path -->
      <img src="kiosk-render.png" alt="Homebrew Hive Kiosk" class="kiosk-image" />
    </div>
  </main>

  <script>
    const openMenuBtn = document.getElementById('openMenu');
    const closeMenuBtn = document.getElementById('closeMenu');
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');

    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    openMenuBtn.addEventListener('click', openDrawer);
    closeMenuBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);
  </script>
</body>
</html>
